<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>일본어 공부하자</title>
<meta name="theme-color" content="#c8102e">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@500;700;900&family=Noto+Sans+KR:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: 역 안내판처럼 짧고 분명하게
IDEA: 일본 전철 노선도 — 12개 역, 최종 시험 = 종착역(終)
PICTURE: 진행률이 차오르는 노선도 + 큼직한 카드 한 장
COLOUR / TYPE: 흰 바탕, 먹색, 히노마루 빨강 하나 / Zen Kaku Gothic New + Noto Sans KR
LAYOUT: 한 열, 폰 우선, 버튼은 엄지 닿는 아래쪽 */
:root{color-scheme:light dark;--bg:light-dark(#fff,#111214);--ink:light-dark(#16171a,#ececec);--mut:light-dark(#6b6f76,#9aa0a8);--line:light-dark(#e4e4e7,#2b2d31);--card:light-dark(#f5f5f6,#1c1d21);--red:light-dark(#c8102e,#d02a42);--redt:light-dark(#c8102e,#ff6678);--ok:light-dark(#1f7a4d,#5fd39a);--bad:light-dark(#b3261e,#ff8a80)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 'Noto Sans KR',system-ui,sans-serif;overflow-x:clip}
.jp{font-family:'Zen Kaku Gothic New','Noto Sans KR',sans-serif}
main{max-width:720px;margin:0 auto;padding:16px max(4vw,16px) 60px}
h1{font:900 clamp(30px,7vw,44px)/1.05 'Zen Kaku Gothic New','Noto Sans KR';margin:8px 0 4px;text-wrap:balance}
h2{font-size:21px;margin:28px 0 8px}
.sub{color:var(--mut);margin:0 0 6px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--red);outline-offset:2px}
.map{position:relative;display:flex;justify-content:space-between;margin:22px 0 4px}
.rail{position:absolute;left:10%;right:10%;top:20px;height:8px;background:var(--line);border-radius:4px;overflow:hidden}
.rail i{display:block;height:100%;background:var(--red);transition:width .6s}
.st{position:relative;z-index:1;background:none;border:0;width:20%;display:flex;flex-direction:column;align-items:center;gap:4px;padding:0}
.st b{width:48px;height:48px;border-radius:50%;border:5px solid var(--red);background:var(--bg);display:grid;place-items:center;font-weight:900;font-size:18px}
.st.done b{background:var(--red);color:#fff}
.st.now b{box-shadow:0 0 0 6px color-mix(in srgb,var(--red) 22%,transparent)}
.st span{font:700 14px/1.2 'Zen Kaku Gothic New';text-align:center}
.st small{font-size:12px;color:var(--mut);text-align:center;line-height:1.2}
.go{display:block;width:100%;margin:20px 0 0;padding:18px 20px;border:0;border-radius:20px;background:var(--red);color:#fff;text-align:left}
.go b{display:block;font-size:24px;font-weight:800}
.go span{display:block;font-size:15px;margin-top:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:14px}
.stats div{background:var(--card);border-radius:14px;padding:10px 12px}
.stats b{display:block;font-size:22px;font-weight:800;white-space:nowrap}.stats small{color:var(--mut);font-size:13px}
.stage{display:grid;grid-template-columns:48px minmax(0,1fr);gap:14px;padding:14px 0;border:0;border-top:1px solid var(--line);background:none;width:100%;text-align:left}
.stage .no{width:48px;height:48px;border-radius:50%;border:4px solid var(--red);display:grid;place-items:center;font-weight:900;font-size:19px}
.stage.done .no{background:var(--red);color:#fff}
.stage h3{margin:0;font-size:18px}.stage h3 .jp{color:var(--redt);margin-right:6px}
.stage p{margin:3px 0 6px;color:var(--mut);font-size:15px}
.meta{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--mut)}.meta b{color:var(--ink)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--red);transition:width .3s}
.how{background:var(--card);border-radius:16px;padding:16px 18px;margin-top:24px;font-size:15px}.how ul{margin:6px 0 0;padding-left:20px}
.top{display:flex;align-items:center;gap:12px;margin-bottom:12px}.top .bar{flex:1}
.x{width:44px;height:44px;border-radius:50%;border:0;background:var(--card);font-size:18px;flex:none}
.tag{font-size:13px;color:var(--mut);white-space:nowrap}
.flash{position:relative;min-height:280px;border-radius:22px;background:var(--card);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:30px 18px}
.big{font:900 clamp(64px,22vw,124px)/1.05 'Zen Kaku Gothic New'}
.mid{font:700 clamp(24px,6.5vw,38px)/1.3 'Zen Kaku Gothic New';text-wrap:balance}
.ko{font:700 clamp(22px,6vw,32px)/1.3 'Noto Sans KR';text-wrap:balance}
.flash .r{font-size:20px;color:var(--mut);margin-top:10px}
.flash .k{font-size:20px;font-weight:700;margin-top:6px;text-wrap:balance}
.hint{font-size:14px;color:var(--mut);margin-top:12px}
.say{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:50%;border:0;background:var(--bg);font-size:18px}
.bigsay{width:110px;height:110px;border-radius:50%;border:0;background:var(--red);color:#fff;font-size:42px}
.peek{background:none;border:0;color:var(--mut);text-decoration:underline;margin-top:10px;min-height:44px}
.ex{margin-top:14px;text-align:left;width:100%;max-width:520px}
.ex div{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:6px 0;border-top:1px solid var(--line);font-size:17px}
.ex button{flex:none;width:40px;height:40px;border-radius:50%;border:0;background:var(--bg)}
.btn{min-height:52px;padding:0 18px;border-radius:999px;border:2px solid var(--ink);background:var(--bg);font-weight:700;font-size:17px}
.btn.pri{background:var(--red);border-color:var(--red);color:#fff}
.btn:disabled{opacity:.4}
.row{display:flex;gap:10px;margin-top:14px}.row .btn{flex:1}
.opts{display:grid;gap:10px;margin-top:14px}
.opt{min-height:56px;border-radius:14px;border:2px solid var(--line);background:var(--bg);text-align:left;padding:10px 16px;font-size:18px}
.opt.right{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 14%,var(--bg))}
.opt.wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 14%,var(--bg))}
.ansline{min-height:64px;border-bottom:2px solid var(--ink);display:flex;flex-wrap:wrap;gap:8px;padding:10px 0;margin-top:14px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{min-height:48px;padding:0 16px;border-radius:12px;border:2px solid var(--line);background:var(--bg);font:700 20px 'Zen Kaku Gothic New'}
.chip.used{visibility:hidden}
.fb{margin-top:12px;font-weight:700}.fb.ok{color:var(--ok)}.fb.no{color:var(--bad)}
.result{text-align:center;padding:24px 4px}.result strong{display:block;font-size:68px;line-height:1;font-weight:800}
.result p{color:var(--mut)}
.wl{text-align:left;margin-top:14px}.wl div{padding:8px 0;border-top:1px solid var(--line)}
.lesson{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;min-height:52px;padding:8px 0;border:0;border-top:1px solid var(--line);background:none;text-align:left}
.lesson i{font-style:normal;width:28px;height:28px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px}
.lesson.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.lesson small{color:var(--mut)}
details{margin-top:18px}summary{min-height:44px;display:flex;align-items:center;font-weight:700;cursor:pointer}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.item .jp{font-size:18px;font-weight:700}.item small{display:block;color:var(--mut);font-size:14px}
.item button{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:var(--bg)}
.mt{display:block;width:100%;min-height:48px;margin-top:18px;padding:10px 16px;border-radius:14px;border:2px solid var(--line);background:var(--bg);text-align:left;font-size:15px;font-weight:600}.mt.on{border-color:var(--ink);background:var(--card)}
.mute .say,.mute .ex button,.mute .item button{display:none}
.mn{margin-top:10px;font-size:15px;color:var(--mut);text-wrap:balance}
.route{display:flex;align-items:center;margin:20px 0 6px}
.route i{flex:1 1 2px;height:5px;background:var(--line);min-width:1px}
.dot{flex:0 1 26px;min-width:15px;aspect-ratio:1;border-radius:50%;border:3px solid var(--red);background:var(--bg);font-size:11px;font-weight:800;display:grid;place-items:center;padding:0}
.dot.done{background:var(--red);color:#fff}.dot.now{box-shadow:0 0 0 5px color-mix(in srgb,var(--red) 25%,transparent);transform:scale(1.15)}
.dot.term{flex:0 0 28px;font:900 14px 'Zen Kaku Gothic New';border-color:var(--ink)}.dot.term.done{background:var(--ink);color:var(--bg)}
.tname{margin:16px 0 -10px;font-size:13px;font-weight:700;color:var(--mut)}
h2 small{font-size:14px;color:var(--mut);font-weight:600}
.flash .passage{margin-top:30px}
.passage{font:500 17px/1.8 'Zen Kaku Gothic New';text-align:left;white-space:pre-line;width:100%;max-width:560px}
.q2{font-weight:700;font-size:17px;margin-top:14px;text-align:left;width:100%;max-width:560px;border-top:1px solid var(--line);padding-top:10px}
.tr{background:var(--card);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:15px}
.here{margin:8px 0 0;font-size:16px}
.links{display:flex;gap:10px;margin-top:14px}.links.ctl{flex-wrap:wrap}.links.ctl .btn{flex:1 1 30%;font-size:13px;line-height:1.25;padding:6px;white-space:normal}
.links .btn{flex:1;min-height:48px;font-size:15px;padding:0 10px}
.stage.lock,.stage.lock h3,.stage.lock h3 .jp,.stage.lock p,.stage.lock .meta,.stage.lock .meta b{color:var(--mut)}.stage.lock .no{border-color:var(--line)}.stage.lock .no{border-color:var(--line);font-size:16px}
.src{border-top:1px solid var(--line);padding:14px 0}.src h2,.src h3{margin:0 0 4px;font-size:18px}.src p{margin:4px 0;font-size:15px}.src .use{color:var(--ink)}.src .cite{font-size:13px}.src a{color:var(--redt)}.src .cite a{display:inline-block;padding:10px 0}
.ctx{font-size:16px;font-weight:700;margin-bottom:8px;text-wrap:balance}
.heard{font:700 clamp(20px,5.5vw,28px)/1.35 'Zen Kaku Gothic New';margin-top:8px;color:var(--redt);text-wrap:balance}
.arrow{font-size:14px;color:var(--mut);margin:10px 0 4px}
.prenote{background:var(--card);border-radius:12px;padding:10px 14px;font-size:14px;margin:0 0 10px}
.cert span{color:var(--mut)}
.ex small{color:var(--mut)}
.note{font-size:13px;color:var(--mut);margin-top:18px}
.cert{border:3px solid var(--red);border-radius:20px;padding:24px;margin-top:10px}
@media(prefers-reduced-motion:reduce){.rail i,.bar i{transition:none}}
@media(max-width:440px){.dot{font-size:9px;border-width:2px}.dot.now{transform:none}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.st b{width:40px;height:40px;font-size:16px;border-width:4px}.rail{top:16px}.st small{display:none}.st span{font-size:12px}}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.opt .mk{font-weight:800;margin-left:8px;font-size:15px}.opt.right .mk{color:var(--ok)}.opt.wrong .mk{color:var(--bad)}
#app:focus{outline:none}
.rdtabs .chip,.rdopt .chip{font:700 16px 'Noto Sans KR';min-height:44px}.chip.on{border-color:var(--red);background:color-mix(in srgb,var(--red) 12%,var(--bg))}
.rdbox{text-align:left;min-height:180px}.rdj{font-size:clamp(22px,6vw,30px);line-height:2.1;margin:8px 0 4px;word-break:break-all}
.rdj rt{font-size:.45em;color:var(--mut)}.tok{font:inherit;color:inherit;background:none;border:0;padding:0 1px;border-radius:6px;min-height:44px;line-height:inherit;cursor:pointer}
.tok.new{text-decoration:underline 2px var(--redt);text-underline-offset:6px}.tok.on{background:color-mix(in srgb,var(--red) 18%,transparent)}
.gloss{margin:8px 0;padding:10px 12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);font-size:17px}.btn.sm{min-height:44px;font-size:14px;padding:4px 10px;margin-left:6px}
.ib{display:flex;flex-wrap:wrap;align-items:flex-start;gap:10px;margin:0 0 12px;padding:12px 12px 12px 14px;border-radius:16px;border:2px solid var(--red);background:color-mix(in srgb,var(--red) 8%,var(--bg))}
.ib>div{flex:1 1 calc(100% - 60px);display:flex;flex-direction:column;gap:2px}.ib b{font-size:16px}.ib span{font-size:14px;color:var(--ink);line-height:1.45}.ib .btn{order:3;flex:1 1 100%}.ib-x{flex:none}
.chips-wrap{display:flex;flex-wrap:wrap;gap:8px}.chips-wrap .chip{min-width:52px;font:700 16px 'Noto Sans KR'}.startbtn{margin:0}
.pic{font-size:64px;line-height:1;margin:6px 0 4px}.fb .pic{font-size:44px}
.hj{margin-top:10px;font-size:15px;color:var(--ink);font-weight:500;line-height:1.7}.hj b{font-size:18px}
</style></head><body>
<main id="app" tabindex="-1"></main><div id="live" class="vh" aria-live="polite"></div>
<script>
{
const toK=s=>s.replace(/[ぁ-ゖ]/g,c=>String.fromCharCode(c.charCodeAt(0)+96));
const sp=s=>s.trim().split(/\s+/);
const H1=[...'あいうえおかきくけこさしすせそたちつてとなにぬねのはひふへほまみむめもやゆよらりるれろわをん'];
const R1=sp('a i u e o ka ki ku ke ko sa shi su se so ta chi tsu te to na ni nu ne no ha hi fu he ho ma mi mu me mo ya yu yo ra ri ru re ro wa wo n');
const K1=sp('아 이 우 에 오 카 키 쿠 케 코 사 시 스 세 소 타 치 츠 테 토 나 니 누 네 노 하 히 후 헤 호 마 미 무 메 모 야 유 요 라 리 루 레 로 와 오 응');
const ROW1=[5,5,5,5,5,5,5,3,5,3];
const H2=[...'がぎぐげござじずぜぞだぢづでどばびぶべぼぱぴぷぺぽ'];
const R2=sp('ga gi gu ge go za ji zu ze zo da ji zu de do ba bi bu be bo pa pi pu pe po');
const K2=sp('가 기 구 게 고 자 지 즈 제 조 다 지 즈 데 도 바 비 부 베 보 파 피 푸 페 포');
const ROW2=[5,5,5,5,5];
const YH=sp('きゃ きゅ きょ しゃ しゅ しょ ちゃ ちゅ ちょ にゃ にゅ にょ ひゃ ひゅ ひょ みゃ みゅ みょ りゃ りゅ りょ ぎゃ ぎゅ ぎょ じゃ じゅ じょ びゃ びゅ びょ ぴゃ ぴゅ ぴょ');
const YR=sp('kya kyu kyo sha shu sho cha chu cho nya nyu nyo hya hyu hyo mya myu myo rya ryu ryo gya gyu gyo ja ju jo bya byu byo pya pyu pyo');
const YK=sp('캬 큐 쿄 샤 슈 쇼 차 추 초 냐 뉴 뇨 햐 휴 효 먀 뮤 묘 랴 류 료 갸 규 교 자 주 조 뱌 뷰 뵤 퍄 퓨 표');
const XJ=sp('ティ ディ ファ フィ フェ フォ ウィ ウェ ウォ チェ シェ ジェ');
const XR=sp('ti di fa fi fe fo wi we wo che she je');
const XK=sp('티 디 파(f) 피(f) 페(f) 포(f) 위 웨 워 체 셰 제');
const rowsG=(rows,pre)=>{const g=[];rows.forEach((n,i)=>{for(let x=0;x<n;x++)g.push(pre+i)});return g};
const KN=(js,rs,ks,gs,kt)=>js.map((c,i)=>({t:'kana',j:kt?toK(c):c,r:rs[i],k:ks[i],g:gs[i]}));
const smallM=c=>c.length===2?`${c[0]} + 작은 ${c[1]} → 한 소리로`:'';
const YOONIDX=[0,1,2,3,4,5,6,7,8,24,25,26];
const L=(t,s,g)=>s.trim().split('\n').map(l=>{const a=l.split('|').map(x=>x.trim());
  if(t==='gram')return {t,j:a[0],k:a[1],n:a[2]||''};
  if(t==='sit')return {t,ctx:a[0],h:a[1]||'',hk:a[2]||'',j:a[3],k:a[4],n:'',g};
  return {t,j:a[0],r:a[1]||'',k:a[2]||'',n:'',g}});

const S=[
{n:'ひらがな①',ko:'히라가나 기본 46자',goal:'히라가나 46자를 보자마자 읽는다.',cards:[...KN(H1,R1,K1,rowsG(ROW1,'h'))]},

{n:'ひらがな②',ko:'탁음 · 요음 · 첫 단어',goal:'が·ぱ 같은 탁음, きゃ 같은 요음, 작은 っ와 장음을 읽고 쉬운 단어를 소리 내어 읽는다.',cards:[
 ...KN(H2,R2,K2,rowsG(ROW2,'hd')),
 ...L('gram',`
゛ ゜ (탁음·반탁음)|゛ 를 붙이면 탁한 소리 (か→が), ゜ 는 は행만 (は→ぱ)|かき = kaki 감;かぎ = kagi 열쇠
작은 っ (촉음)|다음 자음을 한 번 더 발음|きって = kitte 우표;がっこう = gakkō 학교
장음|あ·い·う가 앞 모음을 길게 늘임|おかあさん = okāsan 어머니;せんせい = sensei 선생님`),
 ...KN(YH,YR,YK,YH.map((_,i)=>'y'+Math.floor(i/6))).map(c=>Object.assign(c,{m:smallM(c.j)})),
 ...L('word',`
あい|ai|사랑
いえ|ie|집
すし|sushi|초밥
ねこ|neko|고양이
いぬ|inu|개
さかな|sakana|생선
うみ|umi|바다
はな|hana|꽃
くるま|kuruma|자동차
でんしゃ|densha|전철
きっぷ|kippu|(승차)표
おちゃ|ocha|차
ぎゅうにゅう|gyūnyū|우유
しゃしん|shashin|사진`,'첫 단어')]},

{n:'カタカナ①',ko:'가타카나 기본 46자',goal:'가타카나 46자를 읽고, 헷갈리는 シ/ツ, ソ/ン을 구분한다.',cards:[...KN(H1,R1,K1,rowsG(ROW1,'k'),1)]},

{n:'カタカナ②',ko:'탁음 · 외래음 · 외래어',goal:'가타카나 탁음·요음·외래음(ティ, ファ)을 읽고 생활 외래어 24개를 안다.',cards:[
 ...KN(H2,R2,K2,rowsG(ROW2,'kd'),1),
 ...L('gram',`
ー (장음 기호)|가타카나는 ー 로 앞 소리를 길게|コーヒー = kōhī 커피;ケーキ = kēki 케이크`),
 ...KN(YOONIDX.map(i=>YH[i]),YOONIDX.map(i=>YR[i]),YOONIDX.map(i=>YK[i]),YOONIDX.map((_,i)=>'ky'+Math.floor(i/6)),1).map(c=>Object.assign(c,{m:smallM(c.j)})),
 ...XJ.map((j,i)=>({t:'kana',j,r:XR[i],k:XK[i],g:'kx'+Math.floor(i/6),m:smallM(j)+' (외래어용 소리)'})),
 ...L('word',`
コーヒー|kōhī|커피
ビール|bīru|맥주
ジュース|jūsu|주스
ケーキ|kēki|케이크
パン|pan|빵
ラーメン|rāmen|라멘
カレー|karē|카레
サラダ|sarada|샐러드
メニュー|menyū|메뉴

네, 죄송합니다.", "g": "독해·청해"}, {"t": "quick", "j": "コーヒーと紅茶、どちらがいいですか。", "a": "コーヒーをお願いします。", "o": ["はい、どちらもです。", "いいえ、いいです。"], "k": "커피랑 홍차 중 어느 게 좋아요? → 커피로 부탁해요.", "g": "즉시 응답"}, {"t": "read", "j": "日本の電車はとても正確です。わたしの国では、電車が10分や20分遅れるのは普通ですが、日本では1分遅れただけでも、「遅れてすみません」というアナウンスがあります。はじめて聞いたとき、とてもおどろきました。", "q": "この人は何におどろきましたか。", "a": "少し遅れただけで謝るアナウンスがあること", "o": ["日本の電車がよく遅れること", "電車の中が静かなこと", "アナウンスが英語だったこと"], "k": "일본 전철은 매우 정확합니다. 우리나라에서는 전철이 10분, 20분 늦는 건 보통이지만, 일본에서는 1분만 늦어도 '늦어서 죄송합니다'라는 안내방송이 나옵니다. 처음 들었을 때 매우 놀랐습니다.", "g": "독해·청해"}, {"t": "dlg", "j": "アナウンス：本日は雨のため、午後の野外コンサートは中止になりました。チケットのお金は、来週までにお返しします。ご迷惑をおかけして申し訳ありません。", "q": "コンサートはどうなりましたか。", "a": "雨で中止になった", "o": ["時間が遅くなった", "中でやることになった", "来週に変わった"], "k": "안내방송: 오늘은 비 때문에 오후 야외 콘서트가 취소되었습니다. 티켓 요금은 다음 주까지 돌려드립니다. 불편을 드려 죄송합니다.", "g": "독해·청해"}, {"t": "read", "j": "山下さん、きのうは手伝ってくれて、ありがとう。おかげで引っ越しが早く終わりました。今度の土曜日、お礼にごはんをごちそうしたいです。都合はどうですか。返事を待っています。リン", "q": "リンさんは山下さんに何をしてほしいですか。", "a": "土曜日の都合を教えてほしい", "o": ["引っ越しを手伝ってほしい", "ごはんをごちそうしてほしい", "土曜日に電話してほしい"], "k": "야마시타 씨, 어제는 도와줘서 고마워요. 덕분에 이사가 빨리 끝났어요. 이번 토요일에 답례로 밥을 대접하고 싶어요. 시간 어때요? 답장 기다릴게요. 린", "g": "독해·청해"}, {"t": "dlg", "j": "女：田中くん、顔が赤いけど、熱があるんじゃない？／男：うん、ちょっと。でも、今日はテストがあるから。／女：テストは来週も受けられるよ。今日は帰って休んだら？／男：じゃあ、先生に話してから帰るよ。", "q": "男の人はこれからまず何をしますか。", "a": "先生に話す", "o": ["すぐ家に帰る", "テストを受ける", "病院に行く"], "k": "여: 다나카, 얼굴이 빨간데 열 있는 거 아냐? / 남: 응, 좀. 근데 오늘 시험이 있어서. / 여: 시험은 다음 주에도 볼 수 있어. 오늘은 돌아가서 쉬는 게 어때? / 남: 그럼 선생님한테 말하고 갈게.", "g": "독해·청해"}, {"t": "fill", "j": "パーティーの前に、飲み物を買って（　）。", "a": "おきます", "o": ["しまいます", "なります", "します"], "k": "파티 전에 음료를 사 둡니다.", "g": "빈칸"}, {"t": "fill", "j": "このくつを（　）みてもいいですか。", "a": "はいて", "o": ["きて", "かぶって", "しめて"], "k": "이 신발 신어 봐도 돼요? (신발 = はく)", "g": "빈칸"}, {"t": "fill", "j": "先生に（　）、とてもうれしかったです。", "a": "ほめられて", "o": ["ほめて", "ほめさせて", "ほめたくて"], "k": "선생님께 칭찬받아서 아주 기뻤어요. (수동)", "g": "빈칸"}]}]);

ら、食費が半分になったそうだ。それに、野菜を多く食べるようになって、体の調子もいいらしい。", "q": "料理教室に通うようになって、田中さんはどう変わったか。", "a": "食費が減って、体の調子もよくなった", "o": ["外で食べることが多くなった", "野菜が嫌いになった", "料理の先生になった"], "k": "다나카 씨는 지난달부터 요리 교실에 다니고 있다. 지금까지는 거의 밖에서 먹었지만, 직접 만들게 되고 나서 식비가 절반이 되었다고 한다. 게다가 채소를 많이 먹게 되어 몸 상태도 좋은 것 같다.", "g": "독해·청해"}, {"t": "dlg", "j": "男：課長、明日なんですが、子どもが熱を出してしまって、休ませていただけないでしょうか。／女：それは大変ね。仕事は大丈夫？／男：はい、急ぎの仕事は今日中に終わらせます。／女：わかった。お大事にね。", "q": "男の人は明日どうしますか。", "a": "会社を休む", "o": ["子どもを連れて会社に来る", "急ぎの仕事をする", "課長に仕事を頼む"], "k": "남: 과장님, 내일 말인데요, 아이가 열이 나서 쉬어도 될까요? / 여: 큰일이네. 일은 괜찮아? / 남: 네, 급한 일은 오늘 중으로 끝낼게요. / 여: 알았어. 몸조리 잘하라고 해.", "g": "독해·청해"}]}, {"n": "N3 ④", "ko": "한자 変·打·直·両·式·確·果·容…", "goal": "N3 한자 31자, 단어 182개, 문형 3개, JLPT 실전 문제 5개 (JLPT 형식 포함).", "lv": "n3", "cards": [{"t": "gram", "j": "〜っぽい", "k": "~스럽다, ~기가 있다", "n": "この ふくは こどもっぽいです。= 이 옷은 애 같아요."}, {"t": "gram", "j": "〜ために", "k": "~을 위해, ~때문에", "n": "しけんの ために べんきょうします。= 시험을 위해 공부해요."}, {"t": "gram", "j": "〜に よって", "k": "~에 따라, ~에 의해", "n": "ひとに よって かんがえが ちがいます。= 사람에 따라 생각이 달라요."}, {"t": "kanji", "j": "変", "r": "음 へん / 훈 か.わる・か.わり・か.える", "k": "변할 변", "m": "相変わらず(あいかわらず) 여전히 · 変化(へんか) 변화", "g": "漢字"}, {"t": "kanji", "j": "打", "r": "음 だ・だあす / 훈 う.つ・う.ち-・ぶ.つ", "k": "칠 타", "m": "", "g": "漢字"}, {"t": "kanji", "j": "直", "r": "음 ちょく・じき・じか / 훈 ただ.ちに・なお.す・-なお.す", "k": "곧을 직", "m": "直に(じかに) 곧 · 正直(しょうじき) 정직", "g": "漢字"}, {"t": "kanji", "j": "両", "r": "음 りょう / 훈 てる・ふたつ", "k": "두 량", "m": "両替(りょうがえ) 환전", "g": "漢字"}, {"t": "kanji", "j": "式", "r": "음 しき", "k": "법 식", "m": "正式(せいしき) 정식", "g": "漢字"}, {"t": "kanji", "j": "確", "r": "음 かく・こう / 훈 たし.か・たし.かめる", "k": "굳을 확", "m": "正確(せいかく) 정확 · 確実(かくじつ) 확실", "g": "漢字"}, {"t": "kanji", "j": "果", "r": "음 か / 훈 は.たす・はた.す・-は.たす", "k": "실과 과", "m": "結果(けっか) 결과 · 効果(こうか) 효과", "g": "漢字"}, {"t": "kanji", "j": "容", "r": "음 よう / 훈 い.れる", "k": "얼굴 용", "m": "容易(ようい) 용이 · 容器(ようき) 용기 (그릇)", "g": "漢字"}, {"t": "kanji", "j": "必", "r": "음 ひつ / 훈 かなら.ず", "k": "반드시 필", "m": "必ずしも(かならずしも) 반드시 (~은 아니다) · 必死(ひっし) 필사적", "g": "漢字"}, ほしい", "かばんを直してほしい", "別のかばんを見たい"], "k": "남: 실례합니다, 이 가방 어제 샀는데 여기가 망가져 있어서요. / 점원: 정말 죄송합니다. 새것으로 교환해 드릴까요? 아니면 환불을 원하세요? / 남: 같은 게 있으면 교환해 주세요.", "g": "독해·청해"}, {"t": "quick", "j": "このペン、ちょっと借りてもいい？", "a": "うん、いいよ。", "o": ["うん、借りたよ。", "うん、貸してくれる？"], "k": "이 펜 잠깐 빌려도 돼? → 응, 그래.", "g": "즉시 응답"}, {"t": "read", "j": "今年の夏は例年に比べて気温が高く、熱中症で病院に運ばれる人が多かった。専門家は、のどが渇いていなくてもこまめに水を飲むこと、そして暑い時間帯にはなるべく外に出ないことを勧めている。", "q": "専門家が勧めていることは何か。", "a": "のどが渇く前から水を飲むこと", "o": ["のどが渇いたときだけ水を飲むこと", "暑い時間に運動すること", "病院に行くこと"], "k": "올여름은 예년에 비해 기온이 높아 열사병으로 병원에 실려 가는 사람이 많았다. 전문가는 목이 마르지 않아도 자주 물을 마실 것, 그리고 더운 시간대에는 되도록 밖에 나가지 않을 것을 권하고 있다.", "g": "독해·청해"}, {"t": "dlg", "j": "女：来週の飲み会、何人来るか分かった？／男：今のところ12人。でも、山田さんはまだ返事がないんだ。／女：じゃあ、お店には13人で予約しておこうか。／男：そうだね。来られなかったら、前の日までに連絡すればいいし。", "q": "店は何人で予約しますか。", "a": "13人", "o": ["12人", "11人", "14人"], "k": "여: 다음 주 회식, 몇 명 오는지 알았어? / 남: 지금까지 12명. 근데 야마다 씨가 아직 답이 없어. / 여: 그럼 가게에는 13명으로 예약해 둘까? / 남: 그래. 못 오면 전날까지 연락하면 되니까.", "g": "독해·청해"}, {"t": "quick", "j": "明日の飲み会、参加できそう？", "a": "ごめん、明日はちょっと用事があって。", "o": ["うん、参加してくれてありがとう。", "昨日は楽しかったね。"], "k": "내일 회식 참석할 수 있을 것 같아? → 미안, 내일은 좀 일이 있어서.", "g": "즉시 응답"}, {"t": "read", "j": "兄は子どものころから電車が好きで、今は鉄道会社で車掌として働いている。朝が早く、夜も遅い日があって大変そうだが、「乗客の安全を守る大切な仕事だ」と言って、いつも楽しそうに話してくれる。", "q": "兄は自分の仕事をどう思っているか。", "a": "大変だが、大切でやりがいがある", "o": ["朝が早いので、やめたい", "乗客が多くて、つまらない", "子どものころの夢とは違う"], "k": "형은 어릴 때부터 전철을 좋아해서 지금은 철도 회사에서 차장으로 일하고 있다. 아침이 이르고 밤도 늦은 날이 있어 힘들어 보이지만, '승객의 안전을 지키는 소중한 일'이라며 늘 즐겁게 이야기해 준다.", "g": "독해·청해"}, {"t": "fill", "j": "日本語が話せる（　）、毎日練習しています。", "a": "ように", "o": ["ために", "ところ", "ばかり"], "k": "일본어를 말할 수 있도록 매일 연습하고 있습니다.", "g": "빈칸"}, {"t": "fill", "j": "雨が降っている（　）、試合は予定通り行われた。", "a": "のに", "o": ["ので", "から", "ために"], "k": "비가 오는데도 시합은 예정대로 열렸다.", "g": "빈칸"}, {"t": "fill", "j": "先生の（　）、試験に合格できました。", "a": "おかげで", "o": ["せいで", "ために", "くせに"], "k": "선생님 덕분에 시험에 합격할 수 있었습니다.", "g": "빈칸"}, {"t": "fill", "j": "このレストランは値段が安い（　）、料理がおいしい。", "a": "わりに", "o": ["ばかりに", "かわりに", "うちに"], "k": "이 레스토랑은 가격이 싼 것에 비해 요리가 맛있다 てあげます。", "駅まで送ってもらいました。"], "k": "괜찮으면 역까지 차로 데려다 드릴까요? → 도움이 돼요. 부탁해요.", "g": "즉시 응답"}, {"t": "read", "j": "このアパートは駅から歩いて3分と近く、家賃も周りより安い。ただ、建物が古く、壁が薄いので、隣の部屋の音がよく聞こえる。静かな環境で生活したい人には向かないかもしれないが、通勤の便利さを一番に考える人にはおすすめだ。", "q": "このアパートはどんな人に向いているか。", "a": "通勤のしやすさを重視する人", "o": ["静かな部屋に住みたい人", "新しい建物に住みたい人", "家賃が高くても広い部屋がいい人"], "k": "이 아파트는 역에서 걸어서 3분으로 가깝고 집세도 주변보다 싸다. 다만 건물이 오래되고 벽이 얇아서 옆방 소리가 잘 들린다. 조용한 환경에서 생활하고 싶은 사람에게는 맞지 않을지도 모르지만, 통근 편리함을 가장 중시하는 사람에게는 추천한다.", "g": "독해·청해"}, {"t": "dlg", "j": "女：あの、すみません。この電車、空港まで行きますか。／駅員：いいえ、この電車は次の駅までです。空港へは、次の駅で乗り換えてください。3番線から出る快速が空港まで行きます。", "q": "女の人は空港へどうやって行きますか。", "a": "次の駅で3番線の快速に乗り換える", "o": ["この電車でそのまま行く", "次の駅で降りてバスに乗る", "3番線の各駅停車に乗る"], "k": "여: 저, 실례합니다. 이 전철 공항까지 가나요? / 역무원: 아니요, 이 전철은 다음 역까지입니다. 공항은 다음 역에서 갈아타세요. 3번 승강장에서 출발하는 쾌속이 공항까지 갑니다.", "g": "독해·청해"}, {"t": "quick", "j": "ご注文はお決まりですか。", "a": "すみません、もう少し考えます。", "o": ["はい、決まってください。", "いいえ、注文してください。"], "k": "주문 정하셨어요? → 죄송해요, 조금 더 생각할게요.", "g": "즉시 응답"}, {"t": "read", "j": "【図書館からのお願い】本を返すときは、カウンターか、入り口の返却ポストに入れてください。ただし、CDとDVDは壊れるおそれがあるので、返却ポストには入れず、必ずカウンターに返してください。閉館後は、本のみ返却ポストをご利用いただけます。", "q": "閉館後にDVDを返したい人はどうすればいいか。", "a": "次の日、開館してからカウンターに返す", "o": ["返却ポストに入れる", "入り口に置いて帰る", "本と一緒に返却ポストに入れる"], "k": "【도서관의 부탁】 책을 반납할 때는 카운터나 입구 반납함에 넣어 주세요. 단, CD와 DVD는 망가질 우려가 있으므로 반납함에 넣지 말고 반드시 카운터에 반납해 주세요. 폐관 후에는 책만 반납함을 이용하실 수 있습니다.", "g": "독해·청해"}, {"t": "dlg", "j": "男：ねえ、このシャツとこっちのシャツ、どっちがいいと思う？／女：うーん、色はこっちの青い方がいいけど、形はそっちの方がかっこいいね。／男：じゃあ、形が同じで青いのはないか、店の人に聞いてみるよ。", "q": "男の人はこれから何をしますか。", "a": "店員に、同じ形の青いシャツがあるか聞く", "o": ["青いシャツを買う", "形がいいシャツを買う", "何も買わずに帰る"], "k": "남: 있잖아, 이 셔츠랑 이쪽 셔츠 중 어느 게 좋은 것 같아? / 여: 음, 색은 이쪽 파란 게 좋은데 모양은 그쪽이 멋있네. / 남: 그럼 모양이 같고 파란 게 없는지 점원한테 물어볼게.", "g": "독해·청해"}, {"t": "para", "j": "彼の意見に【賛成】です。", "a": "同じ考えです", "o": ["反対です", "よくわかりません", "興味がありません"], "k": "그의 의견에 찬성입니다.", "g": "비슷한 말"}, {"t": "para", "j": "明日は【たぶん】雨でしょう。", "a": "おそらく", "o": ["きっと", "かならず", "ぜったい"], "k": "내일은 아마 비가 오겠지요.", "g": "비슷한 말"}, {"t": "para", "j": "この料理は【あまい】です。", "a" の「大丈夫です」という言葉がよくわからなかった。お茶を勧めたときに「大丈夫です」と言われ、飲みたいのだと思っていれたら、実は「いりません」という意味だった。同じ言葉でも、場面によって意味が変わることがあるのだと知った。", "q": "この「大丈夫です」は、どういう意味だったか。", "a": "お茶はいらないという意味", "o": ["お茶が飲みたいという意味", "体の調子がいいという意味", "お茶がおいしいという意味"], "k": "일본에 막 왔을 때 나는 일본인의 '괜찮아요'라는 말을 잘 몰랐다. 차를 권했을 때 '괜찮아요'라는 말을 듣고 마시고 싶은 줄 알고 따랐더니, 사실은 '필요 없어요'라는 뜻이었다. 같은 말이라도 상황에 따라 의미가 달라질 수 있다는 것을 알았다.", "g": "독해·청해"}, {"t": "dlg", "j": "女：駅前の新しいラーメン屋、行った？／男：行ったよ。でも、1時間も並んだのに、味は普通だったな。／女：え、そうなの？テレビで紹介されてたから、楽しみにしてたのに。／男：まあ、一度行けば十分かな。", "q": "男の人はラーメン屋についてどう思っていますか。", "a": "並ぶほどおいしくはなかった", "o": ["とてもおいしかったので、また行きたい", "並ばずに入れてよかった", "テレビより安かった"], "k": "여: 역 앞 새 라멘집 가 봤어? / 남: 갔지. 근데 1시간이나 줄 섰는데 맛은 평범했어. / 여: 어, 그래? TV에 소개돼서 기대했는데. / 남: 뭐, 한 번 가면 충분할 듯.", "g": "독해·청해"}, {"t": "read", "j": "運動が体にいいことは誰でも知っている。しかし、毎日続けるのは難しい。そこでおすすめなのが、生活の中で体を動かす工夫だ。たとえば、エレベーターではなく階段を使う、一つ前の駅で降りて歩く、などである。特別な時間を作らなくても、運動の量を増やすことはできる。", "q": "筆者の考えに合うものはどれか。", "a": "毎日の生活の中でも運動はできる", "o": ["運動するためには特別な時間が必要だ", "階段を使うのは体に悪い", "運動は毎日しなくてもいい"], "k": "운동이 몸에 좋다는 것은 누구나 안다. 하지만 매일 계속하기는 어렵다. 그래서 추천하는 것이 생활 속에서 몸을 움직이는 방법이다. 예를 들어 엘리베이터가 아니라 계단을 쓰거나, 한 정거장 전에 내려서 걷는 것 등이다. 특별한 시간을 만들지 않아도 운동량을 늘릴 수 있다.", "g": "독해·청해"}, {"t": "dlg", "j": "アナウンス：お客様にお知らせいたします。この電車は、ただいま前の電車との間隔調整のため、この駅で3分ほど停車いたします。お急ぎのところ、ご迷惑をおかけいたします。", "q": "電車はどうしてこの駅に止まっていますか。", "a": "前の電車との間隔を調整するため", "o": ["事故があったため", "車両が故障したため", "乗客が多すぎるため"], "k": "안내방송: 승객 여러분께 알려 드립니다. 이 전철은 지금 앞 전철과의 간격 조정을 위해 이 역에서 3분 정도 정차합니다. 바쁘신 중에 불편을 드려 죄송합니다.", "g": "독해·청해"}, {"t": "read", "j": "【料理教室　参加者募集】「初めての和食」コース。日時：毎週土曜日　午前10時〜12時（全4回）。料金：8,000円（材料費込み）。定員：12名（先着順）。持ち物：エプロン、タオル。※1回だけの参加は2,500円です。", "q": "1回だけ参加したい人は、いくら払えばいいか。", "a": "2,500円", "o": ["8,000円", "2,000円", "材料費だけ"], "k": "【요리 교실 참가자 모집】 '처음 하는 일식' 코스. 일시: 매주 토요일 오전 10시~12시 (총 4회). 요금: 8,000엔 (재료비 포함). 정원: 12명 (선착순). 준비물: 앞치마, 수건. ※1회만 참가하는 경우 2,500엔입니다.", "g": "독해·청해"}, {"t": "dlg", "j": "男：来月から、ジムに通おうと思ってるんだ。／女：へえ、いいね。どこのジム？／男：会社の近くのところ。仕事の帰りに寄れるから。／女：でも、残業が多いって言ってなかった？／男：だから、24時間開いているところにしたんだよ。", "q": "男の人がそのジムを選んだ理由は何ですか。", "a": "会社に近くて、24時間開いているから", "o": ["家の近くにあるから", "料金が一番安いから", "友だちが通っているから"], "k": "남: 다음 달부터 헬스장 다니려고. / 여: 오, 좋네. 어디 헬스장? / 남: 회사 근처. 퇴근길에 들를 수 있어서. / 여: 근데 야근 많다고 하지 않았어? / 남: 그래서 24시간 하는 데로 했지.", "g": "독해·청해"}, {"t": "para", "j": "彼は【正直な】人だ。", "a": "うそをつかない", "o": ["よく笑う", "よく働く", "お金持ちの"], "k": "그는 정직한 사람이다.", "g": "비슷한 말"}, {"t": "para", "j": "来週までに【提出して】ください。", "a": "出して", "o": ["読んで", "書いて", "コピーして"], "k": "다음 주까지 제출해 주세요.", "g": "비슷한 말"}, {"t": "para", "j": "【さっき】田中さんから電話がありました。", "a": "少し前に", "o": ["昨日", "ずっと前に", "これから"], "k": "아까 다나카 씨에게서 전화가 왔었어요.", "g": "비슷한 말"}, {"t": "para", "j": "この仕事は【きつい】。", "a": "大変だ", "o": ["楽だ", "面白い", "簡単だ"], "k": "이 일은 힘들다.", "g": "비슷한 말"}, {"t": "para", "j": "彼女は【にこにこしながら】話した。", "a": "笑顔で", "o": ["泣きながら", "怒って", "小さな声で"], "k": "그녀는 생글생글 웃으며 말했다.", "g": "비슷한 말"}]}]);

  <div class="stage ${(st.cp[t.key]||0)>=CPP?'done':''}" style="cursor:default"><div class="no">終</div><div><h3>${t.cp}</h3><p>${t.name} 전 범위 ${cpN(t)}문제. 모든 역을 통과하고, 3일 간격 복습을 통과한 카드가 전체 85%·모든 역 80% 이상이면 열려요. (${gateTxt(t)})</p><div class="meta"><span>최고 <b>${st.cp[t.key]||0}점</b></span></div></div></div>`).join('')}
  <p class="note">이 앱은 손으로 쓰는 연습이 없고, JLPT도 쓰기 영역이 없습니다. 발음은 기기 내장 일본어 음성을 씁니다. 기록은 이 기기에만 저장됩니다. 연습 중 90초 동안 손을 안 대면 시간 측정이 멈춥니다.</p>
  <p class="note"><button class="peek" data-act="reset" style="margin:0;padding:0">기록 초기화</button></p>`;
}

function stage(){
  const s=S[vs],ls=LES[vs],all=ls.every((_,j)=>st.done[vs+'-'+j]),lk=!unlocked(vs);
  return `<div class="top"><button class="x" data-act="home" aria-label="홈">←</button><span class="tag">${vs+1}역 / ${N} · ${trackOf(vs).name}</span></div>
  <h1><span class="jp" style="color:var(--redt)">${s.n}</span> ${s.ko}</h1><p class="sub">목표: ${s.goal}</p>
  ${lk?`<div class="how">🔒 ${vs}역 통과 시험(${PASS}점)을 통과하면 열립니다. 완전 학습: 앞 단계를 확실히 한 뒤 넘어가야 뒤가 무너지지 않아요.</div>`:''}
  <h2>레슨 ${ls.length}개</h2>
  ${ls.map((l,j)=>`<button class="lesson ${st.done[vs+'-'+j]?'done':''}" data-les="${j}" ${lk?'disabled':''}><i>${st.done[vs+'-'+j]?'✓':j+1}</i><span class="${l[0].t==='kana'?'jp':''}">${esc(lname(l))}</span><small>${l.length}장</small></button>`).join('')}
  <button class="lesson ${st.pass[vs]>=PASS?'done':''}" data-act="test" ${lk||!all?'disabled':''}><i>${st.pass[vs]>=PASS?'✓':'★'}</i><span><b>통과 시험</b> 20문제 · ${PASS}점 ${all?'':'<small>(레슨을 다 하면 열림)</small>'}</span><small>${st.pass[vs]}점</small></button>
  ${!lk&&st.pass[vs]<PASS?`<button class="lesson" data-act="testout"><i>⇥</i><span><b>이미 알아요 → 건너뛰기 시험</b> <small>통과하면 이 역 레슨을 건너뜁니다</small></span><small></small></button>`:''}
  <details><summary>단어장 전체 (${s.cards.length})</summary>
  ${s.cards.map(c=>EXAM.includes(c.t)?`<div class="item"><div><span class="jp" style="font-size:15px;font-weight:500">${esc(c.j.split('／').join(' / '))}</span><small>${({read:'독해',dlg:'청해',fill:'빈칸',para:'비슷한 말',quick:'즉시 응답'})[c.t]} · ${c.q?esc(c.q)+' → ':''}${esc(c.a)}</small></div><button data-say="${esc(c.j)}" aria-label="듣기">🔊</button></div>`:`<div class="item"><div><span class="jp">${esc(c.j)}</span><small>${c.t==='sit'?esc(c.ctx)+(c.h?' · '+esc(c.h):'')+' → ':''}${c.r?esc(c.r)+' · ':''}${esc(c.k)}</small>${c.n?`<small class="jp">${esc(c.n.split(';')[0])}</small>`:''}</div><button data-say="${esc(c.j)}" aria-label="발음 듣기">🔊</button></div>`).join('')}</details>`;
}

const SRC=[
 ['스스로 떠올리기 (인출 연습)','보고 읽기 대신 문제로 꺼내 보는 것. 10가지 학습법을 비교한 리뷰에서 효과 최상위.','모든 레슨이 "보기 → 바로 문제" 구조. 다시 읽기만 하는 화면은 없음.','Dunlosky 외 (2013), Psychological Science in the Public Interest','https://pubmed.ncbi.nlm.nih.gov/26173288/'],
 ['간격 두고 반복 (분산 학습)','같은 시간이라도 나눠서 보면 훨씬 오래 남음. 317개 실험 메타분석.','복습 간격 10분 → 1시간 → 1일 → 3일 → 7일 → 14일 → 30일 → 60일 → 120일. 하루 복습은 최대 200장(쉰 날만큼 늘어나 최대 600장). 밀린 복습이 많으면 새 레슨을 쉬고 복습부터 정리합니다. 잊기 직전에 다시 나옴.','Cepeda 외 (2006), Psychological Bulletin','https://pubmed.ncbi.nlm.nih.gov/16719566/'],
 ['연속 재학습','한 세션에서 한 번 맞힐 때까지 → 다른 날 다시 맞힐 때까지. 처음부터 여러 번 맞히는 것보다 효율적.','틀린 카드는 몇 문제 뒤 다시 나오고, 며칠 뒤 복습에서 또 맞혀야 단계가 올라감.','Rawson & Dunlosky (2022), Current Directions in Psychological Science','https://journals.sagepub.com/doi/full/10.1177/09637214221100484'],
 ['먼저 맞혀 보기 (사전 테스트)','배우기 전에 틀리더라도 먼저 시도하면 이후 학습이 더 잘 됨.','문형 레슨은 설명 전에 문장 조립을 먼저 시도함. 틀려도 점수에 안 들어감.','Richland, Kornell & Kao (2009); Kornell, Hays & Bjork (2009)','https://pubmed.ncbi.nlm.nih.gov/19751074/'],
 ['섞어서 복습 (인터리빙)','비슷한 것끼리 섞어 보면 구분 능력이 좋아짐. 학습자는 몰아보기가 낫다고 느끼지만 실제 성적은 반대.','복습은 모든 역의 카드가 섞여 나옴. シ/ツ, ソ/ン, ぬ/め 같은 헷갈리는 글자를 일부러 오답으로 붙임.','Kornell & Bjork (2008), Psychological Science','https://pubmed.ncbi.nlm.nih.gov/18578849/'],
 ['소리 내어 말하기 (생산 효과)','소리 내 읽은 단어가 조용히 읽은 것보다 10~20% 더 기억됨. 입 모양만 움직여도 효과.','새 카드마다 "듣고 두 번 따라 말하기". 소리 없이 모드에서도 입 모양 연습 안내.','MacLeod 외 (2010), JEP: Learning, Memory, and Cognition','https://uwaterloo.ca/memory-attention-cognition-lab/sites/default/files/uploads/files/jep10.pdf'],
 ['직접 떠올리기 (산출형 인출)','말하기 능력은 보기 고르기보다 한국어 → 일본어로 직접 떠올리는 연습에서 더 늘어남.','"말해 보기" 카드: 한국어를 보고 일본어를 소리 내어 말한 뒤 정답 확인. 통과 시험도 한→일 위주.','Yanagisawa (2016), KATE Journal','https://www.jstage.jst.go.jp/article/katejournal/30/0/30_11/_article'],
 ['연상 기억법','모양·소리를 아는 이미지와 연결. 키워드법은 러시아어 단어 학습에서 대조군보다 크게 높은 정답률.','가나 92자 전부에 💡 연상 힌트. 요음은 조합 규칙으로 안내.','Atkinson & Raugh (1975); Quackenbush 외 (1989) Hiragana in 48 Minutes','https://escholarship.org/uc/item/5gb7g0zc'],
 ['덩어리 표현 (formulaic sequences)','자주 쓰는 표현을 통째로 익히면 말하기가 유창하게 들림.','인사·위기 탈출·상황 대응을 단어가 아니라 문장 단위로 외움.','Boers 외 (2006), Language Teaching Research','https://benjamins.com/online/ebop/publications/44877'],
 ['쉐도잉','들은 말을 바로 따라 말하면 소리를 단어로 알아듣는 능력(상향식 처리)이 좋아짐.','회화·상황 카드는 듣고 바로 따라 말하기. 점원이 하는 말 알아듣기 문제.','Hamada (2016, 2018), RELC Journal','https://journals.sagepub.com/doi/10.1177/0033688218771380'],
 ['완전 학습 (통과해야 다음)','단원마다 기준을 넘어야 다음으로. 108개 비교 연구 메타분석에서 시험 성적이 평균 0.52 표준편차 상승.','각 역은 통과 시험 85점 이상이어야 다음 역이 열림. 떨어지면 틀린 카드만 다시 잡고 재시험.','Kulik, Kulik & Bangert-Drowns (1990), Review of Educational Research','https://doi.org/10.3102/00346543060002265'],
];
function method(){
  return `<div class="top"><button class="x" data-act="home" aria-label="홈">←</button><span class="tag">공부법</span></div>
  <h1>이 앱의 공부법과 근거</h1><p class="sub">원리마다 무엇인지, 앱에서 어떻게 쓰는지, 근거 논문을 적었습니다.</p>
  ${SRC.map(([t,w,h,c,u],i)=>`<section class="src"><h2>${i+1}. ${t}</h2><p>${w}</p><p class="use"><b>앱에서:</b> ${h}</p><p class="cite"><a href="${u}" target="_blank" rel="noopener">${c}</a></p></section>`).join('')}
  <section class="src"><h2>하루 새 레슨 ${capN()}개 상한 · 최종 시험 조건</h2><p>가상 학습자 시뮬레이션에서 몰아서 하면 시험은 통과해도 1주 뒤 기억이 크게 떨어졌습니다. 그래서 새 레슨은 하루 ${capN()}개까지, 최종 시험은 3일 간격 복습을 통과한 카드가 전체 85%, 모든 역에서 80% 이상일 때 열립니다.</p></section>
  <section class="src"><h2>4가지 영역의 균형 (Nation의 Four Strands)</h2><p>좋은 언어 과정은 의미 중심 입력(읽기·듣기), 의미 중심 출력(말하기), 언어 형태 학습(단어·문법), 유창성 개발을 고르게 담아야 한다는 원칙입니다.</p><p class="use"><b>앱에서:</b> 입력 = 독해·청해·상황 대응, 출력 = 소리 내어 말하기·직접 떠올리기, 형태 학습 = 카드·문형, 유창성 = ⚡ 스피드 복습.</p><p class="cite"><a href="https://core.ac.uk/download/357330216.pdf" target="_blank" rel="noopener">Nation (2007), Innovation in Language Learning and Teaching</a></p></section>
  <section class="src"><h2>다독 (많이 읽고 듣기)</h2><p>아는 단어가 대부분인 쉬운 글을 많이 읽으면 단어가 문맥 속에서 굳어지고 읽기 속도가 올라갑니다. 모르는 단어가 너무 많으면 효과가 크게 떨어집니다.</p><p class="use"><b>앱에서:</b> 📖 다독 모드. 공개 예문 약 5,700개를 N5·N4·N3 단어 수준으로 나눴고, 이미 익힌 단어로 된(모르는 단어 1개 이하) 문장부터 보여 줍니다. 단어를 누르면 뜻이 나오고 복습 카드로 보낼 수 있습니다. '먼저 듣기 모드'로 청해 입력도 됩니다.</p><p class="cite">Nation & Waring (2020), Teaching Extensive Reading in Another Language, Routledge</p></section>
  <section class="src"><h2>자동화 (유창성 개발)</h2><p>느리고 의식적인 처리가 연습을 통해 빠르고 자동적인 처리로 바뀝니다. 실제 회화·청해는 속도 싸움이라, 아는 것을 빨리 꺼내는 연습이 따로 필요합니다.</p><p class="use"><b>앱에서:</b> 이미 익힌 카드만 20문제를 빠르게. 응답 시간을 재고, 2.5초 이내·정답 95%를 목표로 합니다. 하루 새 레슨을 다 하면 자동으로 권합니다. 말하기 속도도 0.7~1.15배로 올려 가며 들을 수 있습니다.</p><p class="cite"><a href="https://doi.org/10.1002/9781405198431.wbeal0067" target="_blank" rel="noopener">DeKeyser & Criado (2013); Suzuki, Maie & Hui (2025), Language Teaching</a></p></section>
  <section class="src"><h2>시험 형식 그대로 연습 (전이 적합 처리)</h2><p>배울 때의 처리 방식이 시험에서 요구되는 처리 방식과 같을수록 성적이 잘 나온다는 원리입니다.</p><p class="use"><b>앱에서:</b> JLPT 문제 유형을 그대로 넣었습니다 — 漢字読み·表記·文脈規定(빈칸)·言い換え(비슷한 말)·文の組み立て(문장 조립)·読解·課題/ポイント理解(대화 청해)·即時応答(3지선다). 노선마다 40문제 모의고사는 JLPT와 같은 방식으로 환산 점수와 과목별 기준점을 보여 줍니다.</p><p class="cite">Morris, Bransford & Franks (1977), Journal of Verbal Learning and Verbal Behavior</p></section>
  <section class="src"><h2>한국어 한자음 활용</h2><p>N5 노선의 한자는 한국 훈음(日 = 날 일)으로 익힙니다. 한국 한자음과 일본 음독은 대응하는 경우가 많아서(학교 → がっこう) 한국어 화자에게 큰 이점입니다. 한자 카드와 '한국 한자음 → 일본 음독' 문형에서 연습합니다.</p></section>
  <section class="src"><h2>데이터 출처</h2><p>JLPT 단어 목록: open-anki-jlpt-decks (Jamie Sinclair, MIT 라이선스, Jonathan Waller의 JLPT 목록 기반). 한자 읽기: kanji-data (David Gouveia, MIT 라이선스). 한국어 뜻·훈음은 직접 번역했습니다. 음성: Kokoro-82M 오픈소스 AI 음성(Apache 2.0, 여성 jf_alpha·남성 jm_kumo)으로 미리 만든 파일. 파일이 없는 문장(다독 등)은 기기 음성으로 읽습니다. JLPT는 공식 단어 목록을 공개하지 않으므로 범위는 추정치입니다.</p></section>
  <section class="src"><h2>한계</h2><p>원리마다 근거는 탄탄하지만, 이 앱 자체를 사람 대상 실험으로 검증한 것은 아닙니다. 홈의 '하루 뒤 기억률'이 80% 이상이면 제대로 작동 중, 그보다 낮으면 하루 공부량을 줄이세요. 한자와 빠른 실제 회화 듣기는 이 과정 범위 밖입니다.</p></section>`;
}

  <h1>홈 화면에 추가하기</h1><p class="sub">이 페이지 주소를 홈 화면에 아이콘으로 꽂아 두면 앱처럼 바로 열립니다.</p>${isStandalone()?'<p class="fb ok">이미 앱으로 설치되어 실행 중이에요.</p>':BIP?'<button class="go" data-act="instgo"><b>📲 지금 설치하기</b><span>버튼 한 번이면 홈 화면에 앱이 생겨요</span></button>':''}
  <section class="src"><h2>안드로이드 (크롬)</h2><p>이 페이지를 크롬으로 열기 → 오른쪽 위 ⋮ → <b>앱 설치</b>(또는 홈 화면에 추가). 설치하면 오프라인에서도 열립니다.</p></section>

const KT={lesson:'레슨',review:'복습',fix:'틀린 것 다시',test:'통과 시험',final:'종합 시험',flu:'스피드 복습',mock:'모의고사'};
function session(){
  const s=ses;
  if(s.phase==='result')return result();
  if(s.phase==='intro'){
    const c=s.intro[s.ii];
    const sitBox=c.t==='sit'?`<div class="ctx">${esc(c.ctx)}</div>${c.h?`<div class="heard jp">「${esc(c.h)}」</div><div class="r">${esc(c.hk)}</div><div class="arrow">↓ 이렇게 말해요</div>`:'<div class="arrow">↓ 이렇게 말해요</div>'}`:'';
    return `${top(s.ii/(s.intro.length*3))}
    <div class="flash">${c.t==='kanji'?'':`<button class="say" data-say="${esc(c.t==='sit'&&c.h?c.h+'。'+c.j:(c.sy||c.j))}" aria-label="다시 듣기">🔊</button>`}${sitBox}
    ${pic(c)}<div class="${c.t==='kana'||c.t==='kanji'?'big':'mid'} jp">${esc(c.j)}</div>${c.r&&c.r!==c.j?`<div class="r ${c.lv||c.t==='kanji'?'jp':''}">${esc(c.r)}</div>`:''}<div class="k">${esc(c.k)}</div>${c.m?`<div class="mn">${c.t==='kanji'?'예) ':'💡 '}${esc(c.m)}</div>`:''}${hanja(c)}
    ${c.ex.length?`<div class="ex">${c.ex.map(e=>`<div><span class="jp">${esc(e.te?e.a+' → '+e.b:e.a)}${e.te?'':`<br><small>${esc(e.b)}</small>`}</span><button data-say="${esc(e.te?e.a+'、'+e.b:e.a)}" aria-label="듣기">🔊</button></div>`).join('')}</div>`:''}
    <div class="hint">${c.t==='kanji'?'훈음과 음독을 소리 내어 두 번 읽기':st.mute?'보고 입 모양으로 두 번 따라 하기':'🔊 듣고 소리 내어 두 번 따라 말하기'}</div></div>
    <div class="row"><button class="btn pri" data-act="inext">${s.ii<s.intro.length-1?`다음 (${s.ii+1}/${s.intro.length})`:'연습 시작 ▶'}</button></div>`;
  }
  const q=s.q,ans=q.ok!==undefined,pre=s.phase==='pre';if(!ans&&!q.t0&&s.kind==='flu')q.t0=performance.now();
  const rem=s.queue.length+1;
  const pr=pre?0:s.noRe?s.done/s.total:(s.kind==='lesson'?1/3:0)+(s.done/(s.done+rem))*(s.kind==='lesson'?2/3:1);
  const preNote=pre?`<p class="prenote">아직 안 배운 문형이에요. <b>감으로 먼저 맞혀 보세요</b> — 틀려도 점수에 안 들어가고, 먼저 시도하면 더 잘 기억돼요.</p>`:'';
  const heard=q.ph?`<div class="heard jp">「${esc(q.ph)}」</div>`:'';
  let body='';
  if(q.kind==='self'){
    body=`<div class="flash" style="min-height:240px">${q.shown?`<button class="say" data-say="${esc(q.say)}" aria-label="듣기">🔊</button>`:''}<div class="${q.big?'big':'ko'} ${q.pj?'jp':''}">${esc(q.p)}</div>${heard}
    ${q.shown?`<div class="${q.pj?'r':'mid jp'}" style="margin-top:12px">${esc(q.rev)}</div>${q.revr&&q.revr!==q.rev?`<div class="r jp">${esc(q.revr)}</div>`:''}${q.c.m?`<div class="mn">💡 ${esc(q.c.m)}</div>`:''}`:''}<div class="hint">${q.shown?'떠올린 게 맞았나요? 솔직하게 — 후하게 채점하면 복습이 너무 늦게 와요':q.hint}</div></div>
    <div class="row">${!q.shown?`<button class="btn pri" data-act="show">정답 보기</button>`:`<button class="btn" data-act="selfno">틀렸다</button><button class="btn pri" data-act="selfyes">맞혔다</button>`}</div>`;
  }else if(q.kind==='build'){
    body=`${preNote}<div class="flash" style="min-height:150px"><div class="ko">${esc(q.p)}</div><div class="hint">${q.hint}</div></div>
    <div class="ansline">${q.sel.map((ci,k)=>`<button class="chip" data-unsel="${k}" ${ans?'disabled':''}>${esc(q.chips[ci])}</button>`).join('')}</div>
    <div class="pool">${q.chips.map((t,ci)=>`<button class="chip ${q.sel.includes(ci)?'used':''}" data-chip="${ci}" ${ans?'disabled':''}>${esc(t)}</button>`).join('')}</div>
    ${ans?`<div class="fb ${q.ok?'ok':'no'}">${q.ok?'정답!':'정답: <span class="jp">'+esc(q.ans)+'</span>'}${pre?' — 이제 설명을 볼게요':''}</div>`:''}
    <div class="row">${ans?`<button class="btn pri" data-act="next">${pre&&s.pi>=s.pre.length-1?'설명 보기 ▶':'다음'}</button>`:`<button class="btn" data-act="clr">지우기</button><button class="btn pri" data-act="check" ${q.sel.length?'':'disabled'}>확인</button>`}</div>`;
  }else{
    const prompt=q.kind==='listen'?`<button class="bigsay" data-say="${esc(q.say)}" aria-label="다시 듣기">🔊</button>${q.peek||ans?`<div class="${q.q2?'passage':'mid'} jp" style="margin-top:12px">${esc(q.pt||q.c.j)}</div>`:`<button class="peek" data-act="peek">소리가 안 나요 → 글자 보기</button>`}${q.q2?`<div class="q2 jp">${esc(q.q2)}</div>`:''}`
      :`${(q.pj||q.ph)&&(q.ph||q.say)?`<button class="say" data-say="${esc(q.ph||q.say)}" aria-label="듣기">🔊</button>`:''}<div class="${q.passage?'passage':q.big?'big':q.pj?'mid':'ko'} ${q.pj?'jp':''}">${esc(q.p)}</div>${q.q2?`<div class="q2 jp">${esc(q.q2)}</div>`:''}${q.sub?`<div class="r">${esc(q.sub)}</div>`:''}${heard}`;
    body=`<div class="flash" style="min-height:200px">${prompt}<div class="hint">${q.hint}</div></div>
    <div class="opts">${q.opts.map((o,i)=>{let cls='';if(ans){if(o===q.ans)cls='right';else if(i===q.picked)cls='wrong'}return `<button class="opt ${q.oj?'jp':''} ${cls}" data-opt="${i}" ${ans?'disabled':''}>${esc(o)}${cls==='right'?'<span class="mk">✓ 정답</span>':cls==='wrong'?'<span class="mk">✗ 내 답</span>':''}</button>`}).join('')}</div>
    ${ans&&q.dt&&s.kind==='flu'?`<div class="fb ${q.dt<=2.5?'ok':''}">${q.dt.toFixed(1)}초 ${q.dt<=2.5?'— 자동화 수준':'— 목표 2.5초 이내'}</div>`:''}${ans&&q.tr?`<div class="tr"><b>해석</b> ${esc(q.tr)}</div>`:''}${ans?`${!q.ok&&q.c.t!=='gram'&&!q.tr?`<div class="fb no">${pic(q.c)}<span class="jp">${esc(q.c.j)}</span> = ${q.c.r&&q.c.r!==q.c.j?esc(q.c.r)+' · ':''}${esc(q.c.k)}${q.c.m?`<div class="mn">💡 ${esc(q.c.m)}</div>`:''}${hanja(q.c)}</div>`:''}<div class="row"><button class="btn pri" data-act="next">다음</button></div>`:''}`;
  }
  return top(pr)+body;
}
const top=p=>`<div class="top"><button class="x" data-act="quit" aria-label="그만하기">✕</button><h1 class="vh">${KT[ses.kind]||'공부'}</h1><div class="bar" role="progressbar" aria-label="진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="${Math.round(p*100)}"><i style="width:${Math.round(p*100)}%"></i></div><span class="tag">${ses.phase==='pre'?'먼저 맞혀보기':KT[ses.kind]}${ses.kind==='mock'&&ses.q&&ses.q.sec?' · '+ses.q.sec:''}</span><button class="x" data-act="mute" aria-label="소리 끄기" aria-pressed="${!!st.mute}">${st.mute?'🔇':'🔈'}</button></div>`;

function result(){
  const s=ses,n=nextStep(),acc=s.done?Math.round(s.right/s.done*100):100;
  const nb=n.kind==='none'?'':`<button class="btn pri" data-act="go">다음 ▶</button>`;
  const nl=`<p style="margin-top:14px">다음: ${esc(n.label)}</p>`;
  if(s.kind==='mock'){const sec=s.secs,m=Math.round((Date.now()-s.t0)/60000);const pc=k=>sec[k]?sec[k][0]/sec[k][1]:0;
    const n3=s.t.key==='n3';let rows,tot,passTot,ok;
    if(n3){const lk=(pc('문자·어휘')*(sec['문자·어휘']?sec['문자·어휘'][1]:0)+pc('문법')*(sec['문법']?sec['문법'][1]:0))/((sec['문자·어휘']?sec['문자·어휘'][1]:0)+(sec['문법']?sec['문법'][1]:0)||1);
      const a=Math.round(lk*60),b=Math.round(pc('독해')*60),c2=Math.round(pc('청해')*60);rows=[['언어지식 (문자·어휘·문법)',a,60,19],['독해',b,60,19],['청해',c2,60,19]];tot=a+b+c2;passTot=95}
    else{const n=['문자·어휘','문법','독해'].reduce((x,k)=>x+(sec[k]?sec[k][1]:0),0),r=['문자·어휘','문법','독해'].reduce((x,k)=>x+(sec[k]?sec[k][0]:0),0);const a=Math.round(r/(n||1)*120),c2=Math.round(pc('청해')*60);rows=[['언어지식·독해',a,120,38],['청해',c2,60,19]];tot=a+c2;passTot=s.t.key==='n4'?90:80}
    ok=tot>=passTot&&rows.every(r=>r[1]>=r[3]);const goal=Math.round(180*.7);
    return `<h1 class="vh">결과</h1><div class="result"><strong>${tot}<small style="font-size:22px">/180</small></strong><p>${s.t.name.replace(' 노선','')} 모의고사 · ${m}분 · 환산 점수</p>
    <div class="wl">${rows.map(r=>`<div><b>${r[0]}</b> ${r[1]}/${r[2]} <small style="color:var(--mut)">(기준점 ${r[3]})</small> ${r[1]>=r[3]?'✓':'✗'}</div>`).join('')}
    ${Object.keys(sec).map(k=>`<div style="color:var(--mut);font-size:14px">${k} ${sec[k][0]}/${sec[k][1]}</div>`).join('')}</div>
    <p>실제 JLPT 합격선: 총점 ${passTot}점 + 과목별 기준점 → <b>${ok?'합격선 이상':'합격선 미달'}</b></p>
    <p>이 모의고사는 실제 시험보다 보기가 쉬운 편이라, <b>${goal}점(70%) 이상</b>을 안정권으로 보세요. 틀린 카드는 복습으로 다시 돌립니다.</p>
    <div class="row"><button class="btn" data-act="home">홈</button><button class="btn pri" data-mock="${s.t.key}">다시 풀기</button></div></div>`}
  if(s.kind==='flu')return `<h1 class="vh">결과</h1><div class="result"><strong>${s.avg?s.avg.toFixed(1):'—'}초</strong><p>스피드 복습 · 평균 응답 시간 · 정답 ${s.right}/${s.total}${st.flu&&st.flu.best?` · 최고 기록 ${st.flu.best.toFixed(1)}초`:''}</p><p>목표: 정답 95% 이상, 평균 2.5초 이내. 틀린 카드는 복습으로 다시 돌립니다.</p>${nl}<div class="row"><button class="btn" data-act="home">홈</button>${nb}</div></div>`;
  if(s.kind==='lesson'||s.kind==='review'||s.kind==='fix')
    return `<h1 class="vh">결과</h1><div class="result"><strong>${acc}%</strong><p>${KT[s.kind]} 완료 · 정답률${s.kind==='lesson'?` · 새 카드 ${s.newIds.length}장`:''}</p>${nl}<div class="row"><button class="btn" data-act="home">홈</button>${nb}</div></div>`;
  const pass=s.score>=(s.kind==='final'?CPP:PASS),wl=[...s.wrong].map(id=>ALL.find(c=>c.id===id));
  const msg=pass?(s.kind==='final'?`${s.t.cp} 합격! ${s.t.key==='intro'?'가나·기초 문형·여행 상황 대응 기본기를 갖췄습니다.':s.t.key.toUpperCase()+' 범위의 한자·어휘·문형·독해·청해 기본기를 갖췄습니다.'}`:s.out?'건너뛰기 성공! 이 역 레슨은 완료 처리했어요.':`통과! ${s.s+2<=N?(s.s+2)+'역이 열렸어요.':'종착역으로.'}`):(s.out?`${PASS}점에 못 미쳤어요. 레슨부터 차근차근 가요.`:`${s.kind==='final'?CPP:PASS}점이 통과선. 틀린 것만 다시 잡고 재시험합니다.`);
  return `<h1 class="vh">결과</h1><div class="result">${pass&&s.kind==='final'?`<div class="cert"><p style="margin:0">${s.t.cp}</p><strong>합격</strong><p>최종 시험 ${s.score}점 · 공부 ${hrs(st.time)}시간</p></div>`:`<strong>${s.score}점</strong>`}
  <p>${s.right}/${s.total} 정답 · ${msg}</p>
  ${wl.length?`<div class="wl"><b>틀린 것</b>${wl.map(c=>`<div><span class="jp">${esc(c.j)}</span> — ${esc(c.k)}</div>`).join('')}</div>`:''}
  ${nl}<div class="row"><button class="btn" data-act="home">홈</button>${nb}</div></div>`;
}

let resetArm=false;
document.addEventListener('click',e=>{
  lastAct=now();
  const t=e.target.closest('button');if(!t||t.disabled)return;
  const d=t.dataset;
  if(d.say!==undefined){say(d.say);return}
  if(d.stage!==undefined){vs=Number(d.stage);view='stage';render();return}
  if(d.mock!==undefined){startMock(TR.find(t=>t.key===d.mock));render();speakNow();return}
  if(d.les!==undefined){startLesson(vs,Number(d.les));render();speakNow();return}
  if(d.opt!==undefined){const q=ses.q;q.picked=Number(d.opt);answer(q.opts[q.picked]===q.ans);render();return}
  if(d.chip!==undefined){ses.q.sel.push(Number(d.chip));render();return}
  if(d.unsel!==undefined){ses.q.sel.splice(Number(d.unsel),1);render();return}
  if(d.tok!==undefined){rdq.w=rdq.w===Number(d.tok)?null:Number(d.tok);const x=rdq.s.t[Number(d.tok)];say(x[1]||x[0]);render();return}
  if(d.rdlv!==undefined){rdS().lv=d.rdlv;save();rdNext();render();return}
  if(d.rdsay!==undefined){rdSay();return}
  if(d.start!==undefined){st.start=Number(d.start);save();view='home';render();aWarm();return}
  if(d.rdadd!==undefined){setSrs(d.rdadd,0);save();render();return}
  const a=d.act;
  if(a==='go')go();
  else if(a==='home'||a==='quit'){view='home';ses=null;render()}
  else if(a==='method'){view='method';render()}
  else if(a==='rate'){const R=[.7,.85,1,1.15];st.rate=R[(R.indexOf(st.rate||.85)+1)%R.length];save();render();say('こんにちは、よろしくお願いします')}
  else if(a==='flu'){startFluency();render()}
  else if(a==='voice'){const V=['mix','f','m'];st.voice=V[(V.indexOf(st.voice||'mix')+1)%3];save();render();vflip=st.voice==='m'?1:0;say('こんにちは、よろしくお願いします')}
  else if(a==='cap'){const C=[5,8,12];st.cap=C[(C.indexOf(capN())+1)%C.length];save();render()}
  else if(a==='install'){view='install';render()}
  else if(a==='instgo'){if(BIP){BIP.prompt();BIP.userChoice.finally(()=>{BIP=null;render()})}}
  else if(a==='insthide'){try{localStorage.setItem('jpInstHide',String(now()))}catch(e){}render()}
  else if(a==='instchrome'){location.href='intent://'+location.host+location.pathname+'#Intent;scheme=https;package=com.android.chrome;end'}
  else if(a==='startpick'){view='start';render()}
  else if(a==='read'){view='read';if(RD&&!rdq)rdNext();render();if(rdq&&rdS().lis)rdSay()}
  else if(a==='rdshow'){rdq.show=true;render()}
  else if(a==='rdtr'){rdq.tr=true;render()}
  else if(a==='rdfuri'){const r=rdS();r.furi=r.furi?0:1;save();render()}
  else if(a==='rdlis'){const r=rdS();r.lis=r.lis?0:1;save();if(rdq)rdq.show=!r.lis;render()}
  else if(a==='rdnext'){const r=rdS();r.n++;r.ch+=plain(rdq.s).length;r.days[today()]=(r.days[today()]||0)+1;rdNext();render();if(r.lis)rdSay()}
  else if(a==='test'){if(unlocked(vs)&&LES[vs].every((_,j)=>st.done[vs+'-'+j])){startTest(vs);render()}}
  else if(a==='testout'){if(unlocked(vs)){startTest(vs,true);render()}}
  else if(a==='inext'){if(ses.ii<ses.intro.length-1)ses.ii++;else{ses.phase='drill';advance()}render();speakNow()}
  else if(a==='next'){advance();render();speakNow()}
  else if(a==='check'){const q=ses.q;answer(q.sel.map(i=>q.chips[i]).join(' ')===q.ans);render()}
  else if(a==='clr'){ses.q.sel=[];render()}
  else if(a==='peek'){ses.q.peek=1;render()}
  else if(a==='show'){ses.q.shown=1;say(ses.q.say);render()}
  else if(a==='selfyes'||a==='selfno'){answer(a==='selfyes');advance();render();speakNow()}
  else if(a==='mute'){st.mute=!st.mute;save();if(st.mute){try{speechSynthesis.cancel()}catch(e){}if(view==='ses'&&ses&&ses.q&&ses.q.kind==='listen'&&ses.q.ok===undefined&&ses.phase!=='pre')ses.q=mkQ(ses.q.c)}render()}
  else if(a==='reset'){if(!resetArm){resetArm=true;t.textContent='정말 초기화하려면 한 번 더 누르세요';return}st=fresh();save();resetArm=false;view='home';render()}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&view==='home')render()});
if('serviceWorker' in navigator&&window.isSecureContext&&/^https?:/.test(location.protocol)){try{navigator.serviceWorker.register('sw.js').catch(()=>{})}catch(e){}}
window.__jp={get aud(){return {idx:AIDX&&AIDX.t?Object.keys(AIDX.t).length:0,packs:Object.keys(APK),src:AEL.src,paused:AEL.paused,rate:AEL.playbackRate}},get st(){return st},get ses(){return ses},get view(){return view},nextStep,LES,ALL,PASS,CPP,N,mkQ};
aLoadIdx();render();

}
</script>
